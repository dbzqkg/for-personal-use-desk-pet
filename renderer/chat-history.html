<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>历史对话</title>
  <style>
    body { margin: 0; font: 14px/1.6 sans-serif; background: #faf7f8; color: #333; }
    header { position: sticky; top: 0; background: #faf7f8; border-bottom: 1px solid #eee; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    header h2 { margin: 0; font-size: 15px; color: #b03a63; flex: 1; }
    header button { padding: 6px 14px; border: 1px solid #e0557a; border-radius: 6px; background: #fff; color: #e0557a; cursor: pointer; }
    header .hint { font-size: 12px; color: #999; }
    #list { padding: 8px 16px 24px; }
    .msg { margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); white-space: pre-wrap; word-break: break-word; }
    .msg.user { border-left: 4px solid #e0557a; }
    .msg.assistant { border-left: 4px solid #7a9de0; }
    .meta { font-size: 12px; color: #aaa; margin-bottom: 4px; display: flex; gap: 8px; }
    .who { font-weight: 700; }
    .msg.user .who { color: #e0557a; }
    .msg.assistant .who { color: #7a9de0; }
    .empty { color: #999; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h2>历史对话（完整记录，不受记忆滑动窗口影响）</h2>
    <span class="hint" id="count"></span>
    <button id="refresh">刷新</button>
    <button id="clear">清空记录</button>
  </header>
  <div id="list"></div>
  <script src="./chat-history.js"></script>
</body>
</html>
